name: Agent Management Dashboard

# Monitor and coordinate all AI workers
# Provides health checks, conflict detection, and recommendations

on:
  # Run twice daily to monitor system health
  schedule:
    - cron: '0 6,18 * * *'  # 6 AM and 6 PM UTC
  
  # Manual trigger for on-demand status checks
  workflow_dispatch:
    inputs:
      detailed_report:
        description: 'Generate detailed report with full analysis'
        required: false
        type: boolean
        default: false

jobs:
  agent-management:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write  # Needed to commit reports
      actions: read    # Needed to check workflow status
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for branch analysis
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Fetch all branches
        run: |
          git fetch --all
          echo "✅ Fetched all remote branches"
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install PyYAML
          echo "✅ Dependencies installed"
      
      - name: Run Agent Orchestrator
        id: orchestrator
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python .github/scripts/agent_orchestrator.py
          echo "orchestrator_exit_code=$?" >> $GITHUB_OUTPUT
      
      - name: Check workflow run history
        id: workflow_history
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "🔍 Checking recent workflow runs using GitHub API..."
          
          # Initialize counters with SAFETY fallbacks to prevent empty outputs
          TOTAL_WORKFLOWS=0
          FAILED_WORKFLOWS=0
          SUCCESS_WORKFLOWS=0
          
          # Create comprehensive workflow summary
          cat > /tmp/workflow_summary.md << 'EOF'
          # Workflow Health Report (Last 24 Hours)
          
          ## Recent Workflow Activity
          
          EOF
          
          # Track failures for detailed reporting
          > /tmp/workflow_failures.txt
          
          # Check each workflow in the repository using GitHub API
          echo "Fetching workflow runs from GitHub API..."
          
          # List all workflows and their recent runs
          # SAFETY: Ensure all command outputs have fallback defaults
          WORKFLOW_LIST=$(gh api repos/:owner/:repo/actions/workflows --jq '.workflows[] | .path' 2>/dev/null || echo "")
          WORKFLOW_LIST=${WORKFLOW_LIST:-""}
          
          if [ -n "$WORKFLOW_LIST" ]; then
            while IFS= read -r workflow_path; do
              if [ -n "$workflow_path" ]; then
                TOTAL_WORKFLOWS=$((TOTAL_WORKFLOWS + 1))
                workflow_name=$(basename "$workflow_path")
                
                # Get recent runs for this workflow (last 5 runs)
                # SAFETY: Handle empty API responses gracefully
                RECENT_RUNS=$(gh api "repos/:owner/:repo/actions/workflows/${workflow_name}/runs?per_page=5" \
                  --jq '.workflow_runs[] | "\(.id)|\(.status)|\(.conclusion)|\(.created_at)"' 2>/dev/null || echo "")
                
                echo "### $workflow_name" >> /tmp/workflow_summary.md
                
                if [ -n "$RECENT_RUNS" ]; then
                  # Process each run
                  RUN_FAILED=false
                  while IFS='|' read -r run_id status conclusion created_at; do
                    if [ "$conclusion" = "failure" ]; then
                      FAILED_WORKFLOWS=$((FAILED_WORKFLOWS + 1))
                      RUN_FAILED=true
                      echo "- ❌ Run #$run_id: FAILED ($(echo $created_at | cut -d'T' -f1))" >> /tmp/workflow_summary.md
                      echo "$workflow_name|$run_id|$created_at" >> /tmp/workflow_failures.txt
                    elif [ "$conclusion" = "success" ]; then
                      SUCCESS_WORKFLOWS=$((SUCCESS_WORKFLOWS + 1))
                      echo "- ✅ Run #$run_id: SUCCESS ($(echo $created_at | cut -d'T' -f1))" >> /tmp/workflow_summary.md
                    elif [ "$status" = "in_progress" ]; then
                      echo "- 🔄 Run #$run_id: IN PROGRESS" >> /tmp/workflow_summary.md
                    elif [ -n "$status" ]; then
                      echo "- ⏸️  Run #$run_id: $status" >> /tmp/workflow_summary.md
                    fi
                  done <<< "$RECENT_RUNS"
                  
                  # Detect output formatting issues (grep/wc failures)
                  if [ "$RUN_FAILED" = true ]; then
                    # Check if failure was due to output issues
                    LATEST_FAILED=$(echo "$RECENT_RUNS" | grep "failure" | head -1 | cut -d'|' -f1)
                    if [ -n "$LATEST_FAILED" ]; then
                      # Get job logs to check for output-related errors
                      JOB_LOGS=$(gh api "repos/:owner/:repo/actions/runs/${LATEST_FAILED}/jobs" \
                        --jq '.jobs[] | select(.conclusion=="failure") | .name' 2>/dev/null || echo "")
                      
                      if echo "$JOB_LOGS" | grep -qi "output\|variable\|grep\|wc"; then
                        echo "  - ⚠️  **Possible output formatting issue detected**" >> /tmp/workflow_summary.md
                      fi
                    fi
                  fi
                else
                  echo "- ℹ️  No recent runs found" >> /tmp/workflow_summary.md
                fi
                
                echo "" >> /tmp/workflow_summary.md
              fi
            done <<< "$WORKFLOW_LIST"
          else
            echo "⚠️  Unable to fetch workflow list from GitHub API" >> /tmp/workflow_summary.md
          fi
          
          # SAFETY: Ensure all outputs have valid values
          TOTAL_WORKFLOWS=${TOTAL_WORKFLOWS:-0}
          FAILED_WORKFLOWS=${FAILED_WORKFLOWS:-0}
          SUCCESS_WORKFLOWS=${SUCCESS_WORKFLOWS:-0}
          
          # Add summary statistics
          cat >> /tmp/workflow_summary.md << EOF
          
          ---
          
          ## Summary Statistics
          
          - **Total Workflows Monitored:** $TOTAL_WORKFLOWS
          - **Successful Runs:** $SUCCESS_WORKFLOWS
          - **Failed Runs:** $FAILED_WORKFLOWS
          - **Success Rate:** $(( TOTAL_WORKFLOWS > 0 ? (SUCCESS_WORKFLOWS * 100) / (SUCCESS_WORKFLOWS + FAILED_WORKFLOWS) : 100 ))%
          
          EOF
          
          # Output to job outputs with SAFETY fallbacks
          echo "total_workflows=$TOTAL_WORKFLOWS" >> $GITHUB_OUTPUT
          echo "failed_workflows=$FAILED_WORKFLOWS" >> $GITHUB_OUTPUT
          echo "success_workflows=$SUCCESS_WORKFLOWS" >> $GITHUB_OUTPUT
          
          cat /tmp/workflow_summary.md
          
          echo "✅ Workflow health check complete"
      
      - name: Analyze worker coordination
        id: coordination
        run: |
          echo "Checking for worker coordination issues..."
          
          # Check if multiple workers modified the same files recently
          COORDINATION_ISSUES=0
          
          # Scene Writer and Content Polisher could conflict
          if git log origin/ai-scene-development --since="24 hours ago" --name-only 2>/dev/null | grep -q "scenes/"; then
            if git log origin/ai-content-polish --since="24 hours ago" --name-only 2>/dev/null | grep -q "scenes/"; then
              echo "⚠️ Both Scene Writer and Content Polisher modified scenes recently"
              COORDINATION_ISSUES=$((COORDINATION_ISSUES + 1))
            fi
          fi
          
          echo "coordination_issues=$COORDINATION_ISSUES" >> $GITHUB_OUTPUT
          
          if [ $COORDINATION_ISSUES -eq 0 ]; then
            echo "✅ No coordination issues detected"
          else
            echo "⚠️ $COORDINATION_ISSUES coordination issues found"
          fi
      
      - name: Generate recommendations
        id: recommendations
        run: |
          echo "Generating system recommendations based on workflow health..."
          
          # Initialize recommendations with SAFETY to ensure non-empty output
          RECOMMENDATIONS=""
          CRITICAL_ISSUES=0
          
          # Check API key
          if [ -z "${{ secrets.ANTHROPIC_API_KEY }}" ]; then
            RECOMMENDATIONS="${RECOMMENDATIONS}\n- 🔴 CRITICAL: Configure ANTHROPIC_API_KEY in repository secrets"
            CRITICAL_ISSUES=$((CRITICAL_ISSUES + 1))
          fi
          
          # Check coordination issues
          COORD_ISSUES=${{ steps.coordination.outputs.coordination_issues }}
          COORD_ISSUES=${COORD_ISSUES:-0}
          if [ "$COORD_ISSUES" -gt 0 ]; then
            RECOMMENDATIONS="${RECOMMENDATIONS}\n- ⚠️  Review recent commits for potential worker conflicts ($COORD_ISSUES detected)"
          fi
          
          # Check workflow failures with SAFETY fallbacks
          FAILED_COUNT=${{ steps.workflow_history.outputs.failed_workflows }}
          FAILED_COUNT=${FAILED_COUNT:-0}
          if [ "$FAILED_COUNT" -gt 0 ]; then
            RECOMMENDATIONS="${RECOMMENDATIONS}\n- ⚠️  $FAILED_COUNT workflow failures detected in last 24 hours - review logs"
            RECOMMENDATIONS="${RECOMMENDATIONS}\n- 💡 Check for output formatting issues (empty grep/wc results)"
            RECOMMENDATIONS="${RECOMMENDATIONS}\n- 💡 Verify all workflow variables use \${VAR:-default} pattern"
            
            # Parse failure details if available
            if [ -f "/tmp/workflow_failures.txt" ]; then
              FAILURE_COUNT=$(wc -l < /tmp/workflow_failures.txt 2>/dev/null || echo "0")
              FAILURE_COUNT=${FAILURE_COUNT:-0}
              if [ "$FAILURE_COUNT" -gt 3 ]; then
                RECOMMENDATIONS="${RECOMMENDATIONS}\n- 🔴 CRITICAL: Multiple workflow failures ($FAILURE_COUNT) - immediate investigation required"
                CRITICAL_ISSUES=$((CRITICAL_ISSUES + 1))
              fi
            fi
          fi
          
          # Check health score
          if [ -f "logs/agent-management/status-$(date +%Y-%m-%d).json" ]; then
            HEALTH=$(python -c "import json; print(json.load(open('logs/agent-management/status-$(date +%Y-%m-%d).json'))['health_score'])" 2>/dev/null || echo "100")
            HEALTH=${HEALTH:-100}
            if [ "$HEALTH" -lt 70 ]; then
              RECOMMENDATIONS="${RECOMMENDATIONS}\n- ⚠️  System health at ${HEALTH}% - investigate issues"
            fi
          fi
          
          # Success case with SAFETY
          if [ -z "$RECOMMENDATIONS" ]; then
            RECOMMENDATIONS="- ✅ System operating normally\n- ✅ All workflows healthy\n- ✅ No coordination issues detected"
          fi
          
          # Generate detailed report artifact
          cat > /tmp/recommendations.md << EOF
          # Agent Management Recommendations
          
          **Generated:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")
          **Critical Issues:** $CRITICAL_ISSUES
          
          ## Action Items
          
          EOF
          
          echo -e "$RECOMMENDATIONS" >> /tmp/recommendations.md
          
          # Add workflow failure prevention guidance
          cat >> /tmp/recommendations.md << 'EOF'
          
          ---
          
          ## Workflow Output Safety Pattern
          
          To prevent workflow failures from empty outputs, all bash commands that feed into
          \`$GITHUB_OUTPUT\` or job outputs should use the safety pattern:
          
          \`\`\`bash
          # SAFETY: Apply fallback to prevent empty output
          VAR=$(command | grep something || echo "0")
          VAR=${VAR:-0}
          echo "var=$VAR" >> $GITHUB_OUTPUT
          \`\`\`
          
          This ensures:
          1. Command failures don't leave variables empty
          2. The \`|| echo "0"\` provides first-level fallback
          3. The \`${VAR:-0}\` provides second-level fallback
          4. Output is always valid for workflow processing
          
          ---
          
          ## Recent Workflow Failures
          
          EOF
          
          # Append failure details if they exist
          if [ -f "/tmp/workflow_failures.txt" ] && [ -s "/tmp/workflow_failures.txt" ]; then
            echo "The following workflows had failures:" >> /tmp/recommendations.md
            echo "" >> /tmp/recommendations.md
            while IFS='|' read -r workflow run_id timestamp; do
              echo "- **$workflow**: Run #$run_id at $timestamp" >> /tmp/recommendations.md
            done < /tmp/workflow_failures.txt
          else
            echo "✅ No workflow failures in the monitoring period." >> /tmp/recommendations.md
          fi
          
          # Output recommendations
          echo -e "$RECOMMENDATIONS"
          cat /tmp/recommendations.md
          
          # Set outputs with SAFETY
          echo "critical_issues=$CRITICAL_ISSUES" >> $GITHUB_OUTPUT
      
      - name: Upload status reports as artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agent-management-reports
          path: |
            logs/agent-management/status-*.json
            logs/agent-management/status-*.md
            /tmp/workflow_summary.md
            /tmp/recommendations.md
            /tmp/workflow_failures.txt
          retention-days: 30
      
      - name: Commit reports to logs
        run: |
          if [[ -n $(git status --porcelain logs/) ]]; then
            git config --global user.name "Agent Manager"
            git config --global user.email "agent-manager@spiralverse.dev"
            
            git add logs/agent-management/
            git commit -m "[AGENT-MANAGER] Status report $(date +%Y-%m-%d)
            
            Health Score: $(python -c "import json; print(json.load(open('logs/agent-management/status-$(date +%Y-%m-%d).json'))['health_score'])" 2>/dev/null || echo 'N/A')
            Coordination Issues: ${{ steps.coordination.outputs.coordination_issues }}
            Timestamp: $(date -u)"
            
            # Push to a management branch (don't clutter main)
            # Use --force-with-lease for safety - if push fails, branch has unexpected changes
            git push origin HEAD:agent-management-logs --force-with-lease
            
            echo "✅ Reports committed to agent-management-logs branch"
          else
            echo "ℹ️ No new reports to commit"
          fi
      
      - name: Create summary
        if: always()
        run: |
          echo "## 🎯 Agent Management Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # SAFETY: Apply fallbacks for all variables used in summary
          FAILED_COUNT=${{ steps.workflow_history.outputs.failed_workflows }}
          FAILED_COUNT=${FAILED_COUNT:-0}
          SUCCESS_COUNT=${{ steps.workflow_history.outputs.success_workflows }}
          SUCCESS_COUNT=${SUCCESS_COUNT:-0}
          TOTAL_WF=${{ steps.workflow_history.outputs.total_workflows }}
          TOTAL_WF=${TOTAL_WF:-0}
          COORD_ISSUES=${{ steps.coordination.outputs.coordination_issues }}
          COORD_ISSUES=${COORD_ISSUES:-0}
          CRITICAL=${{ steps.recommendations.outputs.critical_issues }}
          CRITICAL=${CRITICAL:-0}
          
          if [ -f "logs/agent-management/status-$(date +%Y-%m-%d).json" ]; then
            HEALTH=$(python -c "import json; print(json.load(open('logs/agent-management/status-$(date +%Y-%m-%d).json'))['health_score'])" 2>/dev/null || echo "Unknown")
            HEALTH=${HEALTH:-Unknown}
            echo "- **System Health:** ${HEALTH}/100" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "- **Workflows Monitored:** $TOTAL_WF" >> $GITHUB_STEP_SUMMARY
          echo "- **Successful Runs:** $SUCCESS_COUNT" >> $GITHUB_STEP_SUMMARY
          echo "- **Failed Runs:** $FAILED_COUNT" >> $GITHUB_STEP_SUMMARY
          echo "- **Coordination Issues:** $COORD_ISSUES" >> $GITHUB_STEP_SUMMARY
          echo "- **Critical Issues:** $CRITICAL" >> $GITHUB_STEP_SUMMARY
          echo "- **Timestamp:** $(date -u)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          echo "### Recommendations" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ -f "/tmp/recommendations.md" ]; then
            # Extract just the action items section
            sed -n '/^## Action Items/,/^---/p' /tmp/recommendations.md | grep -v "^---" >> $GITHUB_STEP_SUMMARY
          else
            echo "- ✅ System operating normally" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📊 Detailed reports available in artifacts" >> $GITHUB_STEP_SUMMARY
      
      - name: Set workflow status
        if: always()
        run: |
          EXIT_CODE=${{ steps.orchestrator.outputs.orchestrator_exit_code }}
          
          if [ "$EXIT_CODE" = "0" ]; then
            echo "✅ Agent management system healthy"
            exit 0
          elif [ "$EXIT_CODE" = "1" ]; then
            echo "⚠️ Agent management system has warnings"
            exit 0  # Don't fail workflow, just warn
          else
            echo "🔴 Agent management system has critical issues"
            exit 0  # Still don't fail - this is just monitoring
          fi
