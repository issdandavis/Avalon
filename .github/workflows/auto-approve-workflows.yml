name: Auto-Approve Enterprise Account Workflows

# Automatically approves and enables workflow runs from all enterprise accounts
# For multi-profile organizations where one person manages multiple accounts

on:
  workflow_run:
    workflows: ["*"]
    types:
      - requested
  
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened

permissions:
  actions: write
  contents: write
  pull-requests: write
  checks: write

jobs:
  auto-approve:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate actor and auto-approve workflow runs
        id: validate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "🔓 Validating actor for enterprise account auto-approval"
          
          # List of approved enterprise account usernames/emails
          APPROVED_ACCOUNTS=(
            "issdandavis"
            "215328633+issdandavis@users.noreply.github.com"
          )
          
          # Determine the actor based on event type
          if [[ "${{ github.event_name }}" == "pull_request_target" ]]; then
            ACTOR="${{ github.event.pull_request.user.login }}"
          elif [[ "${{ github.event_name }}" == "workflow_run" ]]; then
            ACTOR="${{ github.event.workflow_run.actor.login }}"
          else
            ACTOR="${{ github.actor }}"
          fi
          
          echo "Event: ${{ github.event_name }}"
          echo "Actor: $ACTOR"
          
          # Check if actor is in approved list
          APPROVED=false
          for account in "${APPROVED_ACCOUNTS[@]}"; do
            if [[ "$ACTOR" == "$account" ]]; then
              APPROVED=true
              break
            fi
          done
          
          if [[ "$APPROVED" == "true" ]]; then
            echo "✅ Account $ACTOR is approved for auto-workflow execution"
            echo "approved=true" >> $GITHUB_OUTPUT
          else
            echo "⚠️ Account $ACTOR is not in approved list - skipping auto-approval"
            echo "approved=false" >> $GITHUB_OUTPUT
            exit 0
          fi
      
      - name: Enable workflow runs for PRs
        if: github.event_name == 'pull_request_target' && steps.validate.outputs.approved == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # Approve PR from enterprise account
          gh pr review $PR_NUMBER --approve --body "✅ Auto-approved: Enterprise account workflow authorization"
          echo "✅ PR #$PR_NUMBER auto-approved"
      
      - name: Set workflow approval status
        if: steps.validate.outputs.approved == 'true'
        run: |
          echo "✅ Enterprise account auto-approval complete"
          echo "All workflows from approved accounts will run automatically"
