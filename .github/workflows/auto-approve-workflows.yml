name: Auto-approve enterprise workflows

on:
  workflow_run:
    # Run for *any* workflow that hits the "needs approval" gate
    # (wildcard pattern supported for workflow_run) 0
    workflows: ["**"]
    types:
      - requested

  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened

permissions:
  actions: write          # needed to approve workflow runs 1
  contents: read
  pull-requests: write    # needed to submit PR reviews
  checks: read

jobs:
  auto-approve:
    runs-on: ubuntu-latest

    steps:
      # 1) Resolve *who* we are approving for, and check against your allow-list
      - name: Check if actor is allow-listed
        id: check-actor
        run: |
          echo "Event name: ${{ github.event_name }}"

          # Start from generic actor
          ACTOR="${{ github.actor }}"

          # Use the more specific fields when they exist
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            ACTOR="${{ github.event.workflow_run.actor.login }}"
          elif [ "${{ github.event_name }}" = "pull_request_target" ]; then
            ACTOR="${{ github.event.pull_request.user.login }}"
          fi

          echo "Resolved actor: $ACTOR"

          # 🔓 Allow-listed accounts (add all your identities here)
          APPROVED_ACCOUNTS=(
            "issdandavis"
            "215328633+issdandavis@users.noreply.github.com"
          )

          APPROVED=false
          for account in "${APPROVED_ACCOUNTS[@]}"; do
            if [ "$ACTOR" = "$account" ]; then
              APPROVED=true
              break
            fi
          done

          echo "approved=$APPROVED" >> "$GITHUB_OUTPUT"
          echo "actor=$ACTOR" >> "$GITHUB_OUTPUT"

      # 2) Auto-approve the PR itself (so reviews don’t block you)
      - name: Auto-approve PR (pull_request_target)
        if: ${{ github.event_name == 'pull_request_target' && steps.check-actor.outputs.approved == 'true' }}
        env:
          # GitHub CLI uses GH_TOKEN in workflows 2
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          echo "✅ Auto-approving PR #$PR_NUMBER for ${{ steps.check-actor.outputs.actor }}"
          gh pr review "$PR_NUMBER" --approve --body "✅ Auto-approved: Enterprise account workflow authorization"

      # 3) Auto-approve the *workflow run* from a fork
      - name: Auto-approve workflow run (fork PR)
        if: ${{ github.event_name == 'workflow_run' && steps.check-actor.outputs.approved == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          REPO: ${{ github.repository }}
        run: |
          OWNER="${REPO%%/*}"
          NAME="${REPO#*/}"

          echo "🔓 Auto-approving workflow run $RUN_ID in $REPO for ${{ steps.check-actor.outputs.actor }}"

          # REST: POST /repos/{owner}/{repo}/actions/runs/{run_id}/approve 3
          gh api \
            --method POST \
            "repos/$OWNER/$NAME/actions/runs/$RUN_ID/approve"

          echo "✅ Workflow run approved"

      - name: Summary
        run: |
          echo "Enterprise account auto-approval complete for event: ${{ github.event_name }}"
          echo "Actor: ${{ steps.check-actor.outputs.actor }}"
          echo "Approved: ${{ steps.check-actor.outputs.approved }}"
