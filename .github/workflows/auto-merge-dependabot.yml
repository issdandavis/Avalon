name: Auto-Merge Dependabot PRs

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - labeled

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    
    steps:
      - name: Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v1
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"
      
      - name: Enable auto-merge for Dependabot PRs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          echo "🤖 Processing Dependabot PR"
          echo "Update type: ${{ steps.metadata.outputs.update-type }}"
          echo "Package ecosystem: ${{ steps.metadata.outputs.package-ecosystem }}"
          
          # Auto-merge patch and minor updates for GitHub Actions
          if [[ "${{ steps.metadata.outputs.package-ecosystem }}" == "github_actions" ]]; then
            if [[ "${{ steps.metadata.outputs.update-type }}" == "version-update:semver-patch" ]] || \
               [[ "${{ steps.metadata.outputs.update-type }}" == "version-update:semver-minor" ]]; then
              echo "✅ Enabling auto-merge for GitHub Actions ${{ steps.metadata.outputs.update-type }}"
              gh pr merge --auto --squash "$PR_URL"
              gh pr review --approve "$PR_URL" --body "✅ Auto-approved: Dependabot ${{ steps.metadata.outputs.update-type }} for GitHub Actions"
            else
              echo "⚠️ Major version update detected - requires manual review"
            fi
          else
            echo "ℹ️ Non-GitHub Actions ecosystem - requires manual review"
          fi
