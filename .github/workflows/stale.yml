name: Mark Stale Issues and PRs

on:
  schedule:
    # Runs daily at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    
    steps:
      - name: Mark stale issues and PRs
        uses: actions/stale@v9
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          
          # Issue configuration
          days-before-issue-stale: 60
          days-before-issue-close: 14
          stale-issue-message: >
            This issue has been automatically marked as stale because it has not had
            recent activity in the last 60 days. It will be closed in 14 days if no
            further activity occurs. Thank you for your contributions.
          close-issue-message: >
            This issue has been automatically closed due to inactivity. If you believe
            this issue is still relevant, please reopen it or create a new issue with
            updated information.
          stale-issue-label: 'stale'
          exempt-issue-labels: 'pinned,security,bug,enhancement'
          
          # Pull request configuration
          days-before-pr-stale: 45
          days-before-pr-close: 14
          stale-pr-message: >
            This pull request has been automatically marked as stale because it has not
            had recent activity in the last 45 days. It will be closed in 14 days if no
            further activity occurs. Please update the PR or let us know if you need help.
          close-pr-message: >
            This pull request has been automatically closed due to inactivity. If you
            would like to continue this work, please reopen the PR or create a new one.
          stale-pr-label: 'stale'
          exempt-pr-labels: 'pinned,security,wip,in-progress'
          
          # General configuration
          operations-per-run: 100
          remove-stale-when-updated: true
          ascending: true
