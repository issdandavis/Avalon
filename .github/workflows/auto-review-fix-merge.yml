name: Auto-Review, Fix & Merge PRs

on:
  pull_request:
    types: [opened, synchronize, reopened]
  pull_request_review:
    types: [submitted]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to process'
        required: true
        type: string

permissions: {}

jobs:
  auto-review:
    name: Auto-Review PR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write

    outputs:
      approved: ${{ steps.review.outputs.approved }}
      risk_level: ${{ steps.review.outputs.risk_level }}
      can_auto_merge: ${{ steps.review.outputs.can_auto_merge }}

    steps:
      - name: Set PR Ref
        id: vars
        run: |
          echo "ref=${{ github.event.pull_request.head.ref || format('refs/pull/${{ github.event.inputs.pr_number }}/head') }}" >> $GITHUB_OUTPUT
          echo "pr_number=${{ github.event.pull_request.number || github.event.inputs.pr_number }}" >> $GITHUB_OUTPUT

      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.vars.outputs.ref }}
          fetch-depth: 0

      - name: Fetch base branch
        run: git fetch origin main:main

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install pyyaml
          sudo apt-get update && sudo apt-get install -y jq

      - name: Make Scripts Executable
        run: chmod +x .github/scripts/*.py

      - name: Run Auto-Reviewer
        id: review
        env:
          PR_NUMBER: ${{ steps.vars.outputs.pr_number }}
        run: |
          python3 .github/scripts/auto_reviewer.py "$PR_NUMBER" || true

          if [ -f /tmp/review_result.json ]; then
            jq -r '.approved, .risk_level, .can_auto_merge' /tmp/review_result.json | {
              read approved
              read risk_level
              read can_auto_merge

              echo "approved=$approved" >> $GITHUB_OUTPUT
              echo "risk_level=$risk_level" >> $GITHUB_OUTPUT
              echo "can_auto_merge=$can_auto_merge" >> $GITHUB_OUTPUT
            }

            echo "## 🔍 Auto-Review Results" >> $GITHUB_STEP_SUMMARY
            jq -r '"- **Approved:** \(.approved)\n- **Risk Level:** \(.risk_level)\n- **Can Auto-Merge:** \(.can_auto_merge)"' /tmp/review_result.json >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload Review Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: review-result
          path: /tmp/review_result.json

      - name: Post Review Comment
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const prNumber = context.payload.pull_request?.number || parseInt('${{ steps.vars.outputs.pr_number }}');
            if (!prNumber) return;

            try {
              const reviewData = JSON.parse(fs.readFileSync('/tmp/review_result.json', 'utf8'));
              let comment = '## 🤖 Auto-Review Results\n\n';
              comment += `**Risk Level:** ${reviewData.risk_level.toUpperCase()}\n\n`;

              if (reviewData.errors.length)
                comment += '### ❌ Errors\n' + reviewData.errors.map(e => `- ${e}`).join('\n') + '\n\n';
              if (reviewData.warnings.length)
                comment += '### ⚠️ Warnings\n' + reviewData.warnings.map(w => `- ${w}`).join('\n') + '\n\n';
              if (reviewData.suggestions.length)
                comment += '### 💡 Suggestions\n' + reviewData.suggestions.map(s => `- ${s}`).join('\n') + '\n\n';

              comment += reviewData.approved
                ? '✅ **APPROVED** - No blocking issues found\n'
                : '❌ **CHANGES REQUESTED** - Please fix errors before merging\n';

              if (reviewData.can_auto_merge) comment += '🤖 **AUTO-MERGE ELIGIBLE**\n';

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: comment
              });
            } catch (e) {
              console.log('Comment posting failed:', e.message);
            }

      - name: Auto-Approve PR
        if: steps.review.outputs.approved == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.pull_request?.number || parseInt('${{ steps.vars.outputs.pr_number }}');
            if (!prNumber) return;

            await github.rest.pulls.createReview({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
              event: 'APPROVE',
              body: '✅ Auto-approved by automated review system'
            })

  auto-fix:
    name: Auto-Fix Issues
    runs-on: ubuntu-latest
    needs: auto-review
    if: needs.auto-review.outputs.approved == 'false'
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Download Review Results
        uses: actions/download-artifact@v4
        with:
          name: review-result

      - name: Configure Git
        run: |
          git config --global user.name "Auto-Fix Bot"
          git config --global user.email "noreply@github.com"

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Run Auto-Fixer
        run: |
          chmod +x .github/scripts/auto_fixer.py .github/scripts/conflict_resolver.py
          python3 .github/scripts/conflict_resolver.py || true
          python3 .github/scripts/auto_fixer.py "${{ github.event.pull_request.number }}" || true

      - name: Push Fixes
        run: |
          if git diff-index --quiet HEAD --; then
            echo "No fixes to push"
          else
            git push origin HEAD || echo "Could not push fixes"
          fi

      - name: Comment on Fixes
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.pull_request?.number;
            if (!prNumber) return;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: '🔧 Auto-fix attempted. Please review the changes.'
            });

  auto-merge:
    name: Auto-Merge PR
    runs-on: ubuntu-latest
    needs: auto-review
    if: needs.auto-review.outputs.can_auto_merge == 'true' && !contains(github.event.pull_request.labels.*.name, 'no-auto-merge')
    permissions:
      contents: write
      pull-requests: write
      checks: read
      issues: write

    steps:
      - name: Wait for CI to Finish
        id: wait
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const sha = pr?.head?.sha;
            const maxWait = 300_000;
            const interval = 10_000;
            let elapsed = 0;

            while (elapsed < maxWait) {
              const checks = await github.rest.checks.listForRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: sha
              });
              const checkRuns = checks.data.check_runs.filter(c => c.name !== 'Auto-Merge PR');
              const allComplete = checkRuns.every(c => c.status === 'completed');
              if (allComplete) {
                const allPassed = checkRuns.every(c => ['success', 'skipped'].includes(c.conclusion));
                core.setOutput('result', allPassed ? 'success' : 'failed');
                return;
              }
              await new Promise(res => setTimeout(res, interval));
              elapsed += interval;
            }

            core.setOutput('result', 'timeout');

      - name: Merge PR
        if: steps.wait.outputs.result == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const prNumber = pr?.number;
            const riskLevel = '${{ needs.auto-review.outputs.risk_level }}';
            const method = riskLevel === 'low' ? 'rebase' : 'squash';

            await github.rest.pulls.merge({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
              merge_method: method,
              commit_title: `Auto-merge: PR #${prNumber}`,
              commit_message: 'Automatically merged by auto-merge system'
            });

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: `✅ **Auto-merged** using ${method} merge strategy\n\nRisk Level: ${riskLevel}`
            });

            if (pr.head.repo.full_name === `${context.repo.owner}/${context.repo.repo}`) {
              await github.rest.git.deleteRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `heads/${pr.head.ref}`
              });
            }

      - name: Report Status
        if: always()
        run: |
          echo "## 🤖 Auto-Merge Status" >> $GITHUB_STEP_SUMMARY
          echo "- **CI Status:** ${{ steps.wait.outputs.result }}" >> $GITHUB_STEP_SUMMARY
